# Placeholders to be rewritten by launch file:
# - <entity> : Should be replaced by entity name: For example "robot".

# Odom
- ros_topic_name: "odom"
  gz_topic_name: "/model/<entity>/odometry"
  ros_type_name: "nav_msgs/msg/Odometry"
  gz_type_name: "gz.msgs.Odometry"
  direction: GZ_TO_ROS

# TF
- ros_topic_name: "tf"
  gz_topic_name: "/model/<entity>/tf"
  ros_type_name: "tf2_msgs/msg/TFMessage"
  gz_type_name: "gz.msgs.Pose_V"
  direction: GZ_TO_ROS

# Joint State
- ros_topic_name: "joint_states"
  gz_topic_name: "world/empty/model/<entity>/joint_state"
  ros_type_name: "sensor_msgs/msg/JointState"
  gz_type_name: "gz.msgs.Model"
  direction: GZ_TO_ROS

# Cmd vel
- ros_topic_name: "cmd_vel"
  gz_topic_name: "/model/<entity>/cmd_vel"
  ros_type_name: "geometry_msgs/msg/Twist"
  gz_type_name: "gz.msgs.Twist"
  direction: ROS_TO_GZ

# Lidar
- ros_topic_name: "scan"
  gz_topic_name: "/world/empty/model/<entity>/link/base_link/sensor/gpu_lidar/scan/points"
  ros_type_name: "sensor_msgs/msg/LaserScan"
  gz_type_name: "gz.msgs.LaserScan"
  direction: GZ_TO_ROS

# Servo joints
- ros_topic_name: "/servo_conn1_joint/cmd_pos"
  gz_topic_name: "/model/<entity>/joint/servo_conn1_joint/0/cmd_pos"
  ros_type_name: "std_msgs/msg/Float64"
  gz_type_name: "gz.msgs.Double"
  direction: ROS_TO_GZ

- ros_topic_name: "/servo_conn2_joint/cmd_pos"
  gz_topic_name: "/model/<entity>/joint/servo_conn2_joint/0/cmd_pos"
  ros_type_name: "std_msgs/msg/Float64"
  gz_type_name: "gz.msgs.Double"
  direction: ROS_TO_GZ

# Servo G-Mov
- ros_topic_name: "/g_mov_joint/cmd_pos"
  gz_topic_name: "/model/<entity>/joint/g_mov_servo_conn_joint/0/cmd_pos"
  ros_type_name: "std_msgs/msg/Float64"
  gz_type_name: "gz.msgs.Double"
  direction: ROS_TO_GZ

