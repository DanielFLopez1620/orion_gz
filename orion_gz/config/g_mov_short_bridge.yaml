# Placeholders to be rewritten by launch file:
# - <entity> : Should be replaced by entity name: For example "robot".
# - <world> : Correspond to the world name, the world name must be consistent with
#   the file name, for example, 'empty.sdf' world should be called 'empty' inside.

# Pi cam
- ros_topic_name: "/pi_cam/image_raw"
  gz_topic_name: "/world/<world>/model/<entity>/link/g_mov_servo_conn/sensor/camera_g/image"
  ros_type_name: "sensor_msgs/msg/Image"
  gz_type_name: "gz.msgs.Image"
  direction: GZ_TO_ROS

- ros_topic_name: "/pi_cam/camera_info"
  gz_topic_name: "/world/<world>/model/<entity>/link/g_mov_servo_conn/sensor/camera_g/camera_info"
  ros_type_name: "sensor_msgs/msg/CameraInfo"
  gz_type_name: "gz.msgs.CameraInfo"
  direction: GZ_TO_ROS